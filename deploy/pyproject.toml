[project]
name = "vantage-eval"
version = "0.1.0"
description = "Vantage room-sense eval bot — cloud copy, reads a fixture (no vision)"
requires-python = ">=3.11"
dependencies = [
    # Same pipecat stack as the provided server bot, PLUS the daily extra so the
    # bot accepts Daily WebRTC sessions (how Pipecat Cloud / Cekura connect).
    # NO torch / ultralytics — room_query is pure stdlib.
    "pipecat-ai[daily,gradium,openai,runner,silero,webrtc,websocket]>=1.3.0",
    "pipecatcloud>=0.7.1",
]
